<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>М Склад</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #1e1e1e;
        color: #fff;
      }

      table {
        border-collapse: collapse;
        background: #2a2a2a;
        width: 100%;
      }

      th {
        background: #333;
        color: #fff;
        padding: 10px;
        text-align: left;
        border: 1px solid #444;
      }

      td {
        padding: 10px;
        border: 1px solid #444;
      }

      button {
        cursor: pointer;
        padding: 8px 12px;
        border: 1px solid #555;
        border-radius: 4px;
        background: #333;
        color: #fff;
        font-size: 14px;
      }

      button:hover {
        background: #444;
      }

      input, select {
        background: #333;
        color: #fff;
        border: 1px solid #555;
        padding: 8px;
        border-radius: 3px;
        width: 100%;
        box-sizing: border-box;
      }

      input:focus, select:focus {
        outline: none;
        border-color: #b30000;
      }

      h2, h3 {
        color: #fff;
        margin-top: 0;
      }

      .error {
        color: #ff4444;
        margin-top: 10px;
      }

      .success {
        color: #44ff44;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
